<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b24a8">
<title>Willastate — Your life. Your way. Your wishes. Your legacy.</title>

<style>
:root{
  --purple:#4b24a8;
  --purple2:#6b42d8;
  --ink:#171522;
  --muted:#6d6878;
  --bg:#f7f5fb;
  --card:#fff;
  --line:#e8e3f1;
  --green:#1f9d62;
  --pink:#e94f9d;
  --shadow:0 10px 30px rgba(42,25,82,.10);
  --radius:20px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--ink);
  background:var(--bg);
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{min-height:100vh}

.topbar{
  height:72px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-family:Georgia,serif;
  color:var(--purple);
  font-size:25px;
  font-weight:700;
  display:flex;
  gap:8px;
  align-items:center;
}

.brand span{font-size:18px}

.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.iconbtn{
  border:0;
  background:#f0ebfa;
  color:var(--purple);
  width:42px;
  height:42px;
  border-radius:12px;
}

.layout{
  display:flex;
  max-width:1280px;
  margin:auto;
}

.sidebar{
  width:260px;
  padding:24px 16px;
  min-height:calc(100vh - 72px);
  border-right:1px solid var(--line);
  background:#fff;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:13px 14px;
  border-radius:13px;
  color:#3f3a49;
}

.nav button.active,
.nav button:hover{
  background:#f0ebfa;
  color:var(--purple);
  font-weight:700;
}

.content{
  flex:1;
  padding:28px;
  max-width:1000px;
}

.hero{
  background:linear-gradient(135deg,#fff,#f0eafb);
  border:1px solid var(--line);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
  margin-bottom:24px;
}

.eyebrow{
  color:var(--purple);
  font-weight:800;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

h1{
  font-size:38px;
  line-height:1.08;
  margin:10px 0 8px;
}

h2{
  font-size:27px;
  margin:0 0 8px;
}

h3{margin:0 0 7px}

p{
  color:var(--muted);
  line-height:1.55;
}

.btn{
  border:0;
  border-radius:13px;
  padding:12px 17px;
  font-weight:800;
}

.primary{
  background:var(--purple);
  color:#fff;
}

.secondary{
  background:#fff;
  color:var(--purple);
  border:1px solid #cfc5e5;
}

.danger{
  background:#fff0f1;
  color:#b4232c;
}

.success{
  background:#edf9f2;
  color:#147a49;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 5px 18px rgba(42,25,82,.05);
}

.tile{
  display:flex;
  gap:14px;
  align-items:center;
  min-height:92px;
  transition:.15s;
}

.tile:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
}

.tile .ico{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:#f0ebfa;
}

.tile small{color:var(--muted)}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.stack{
  display:flex;
  flex-direction:column;
  gap:14px;
}

label{
  font-size:13px;
  font-weight:800;
  color:#3e3948;
  display:block;
  margin-bottom:6px;
}

input,textarea,select{
  width:100%;
  border:1px solid #dcd5e8;
  background:#fff;
  border-radius:12px;
  padding:12px 13px;
  outline:none;
}

textarea{
  min-height:150px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px #eee8fa;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:800;
  background:#edf9f2;
  color:var(--green);
}

.badge.pending{
  background:#fff5dc;
  color:#9a6a00;
}

.badge.locked{
  background:#f1eef5;
  color:#5d5767;
}

.list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.list-item{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  background:#fff;
}

.notice{
  background:#f6f1ff;
  border:1px solid #ded3f4;
  padding:14px;
  border-radius:14px;
  color:#4a3b68;
}

.diary-entry{
  border-left:4px solid var(--pink);
  padding:15px 17px;
  background:#fff;
  border-radius:0 15px 15px 0;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.message-post{
  border-left:4px solid var(--purple);
  padding:17px;
  background:#fff;
  border-radius:0 15px 15px 0;
  border:1px solid var(--line);
}

.message-post.board{
  border-left-color:#6b42d8;
}

.dot-grid{
  display:grid;
  grid-template-columns:repeat(3,62px);
  gap:18px;
  justify-content:center;
  padding:18px;
}

.dot{
  width:62px;
  height:62px;
  border-radius:50%;
  border:2px solid #b9b1c7;
  background:#fff;
  position:relative;
}

.dot.selected{
  background:#a8dfb8;
  border-color:#49a96d;
}

.dot.selected:after{
  content:"";
  position:absolute;
  inset:15px;
  border-radius:50%;
  background:#fff;
}

.pattern-area{
  background:#131c29;
  border-radius:22px;
  padding:22px;
  color:#fff;
  text-align:center;
}

.pattern-area p{color:#c6ccd6}

.mobile-nav{
  display:none;
}

.muted{color:var(--muted)}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
}

.check input{width:auto}

.empty{
  text-align:center;
  padding:30px 15px;
}

.date-heading{
  background:#f0ebfa;
  color:var(--purple);
  border-radius:12px;
  padding:10px 13px;
  font-weight:800;
  margin-top:8px;
}

.small-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.small-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--purple);
  border-radius:10px;
  padding:8px 11px;
  font-weight:700;
}

.small-btn.delete{
  color:#b4232c;
  background:#fff0f1;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,14,30,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal.show{display:flex}

.modal-box{
  background:#fff;
  border-radius:22px;
  padding:24px;
  max-width:520px;
  width:100%;
  max-height:90vh;
  overflow:auto;
}

.mobile-preview{
  max-width:390px;
  margin:0 auto;
  border:10px solid #17151d;
  border-radius:38px;
  background:#fff;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.mobile-head{
  height:58px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  color:var(--purple);
  font-weight:800;
}

.mobile-body{
  padding:16px;
  max-height:650px;
  overflow:auto;
}

.public-profile{
  max-width:560px;
  margin:auto;
}

.profile-cover{
  background:linear-gradient(135deg,#4b24a8,#7c55dc);
  height:120px;
  border-radius:22px 22px 0 0;
}

.avatar{
  width:84px;
  height:84px;
  border-radius:50%;
  background:#fff;
  border:5px solid #fff;
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  font-size:30px;
  margin:-42px auto 8px;
  color:var(--purple);
}

@media(max-width:820px){

  .sidebar{display:none}

  .content{
    padding:18px 14px 90px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .topbar{
    padding:0 14px;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top:1px solid var(--line);
    z-index:30;
    justify-content:space-around;
    padding:8px 4px;
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    color:#625b70;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }

  .mobile-nav button.active{
    color:var(--purple);
    font-weight:800;
  }

  .hero{padding:24px}

  h1{font-size:31px}

  .row{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<noscript>
<div style="padding:20px;background:#fff0f1;color:#7a1f26;text-align:center;font-weight:700">
Willastate needs JavaScript enabled to use the interactive prototype.
</div>
</noscript>

<div class="app">

<header class="topbar">
  <div class="brand">Willastate <span>🪶</span></div>

  <div class="top-actions">
    <button class="iconbtn" onclick="showPage('profile')">👤</button>
    <button class="iconbtn" onclick="showPage('settings')">⚙️</button>
  </div>
</header>

<div class="layout">

<aside class="sidebar">
  <div class="nav" id="nav"></div>
</aside>

<main class="content" id="content"></main>

</div>

<nav class="mobile-nav" id="mobileNav"></nav>

</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>

/* =========================================================
   WILLASTATE PROTOTYPE
   Local browser storage version
   ========================================================= */

const pages = [
 ['home','⌂','Home'],
 ['will','✍️','My Will'],
 ['diary','📔','Mobile Diary'],
 ['board','💬','Message Board'],
 ['info','📝','My Information'],
 ['messages','❤️','My Messages'],
 ['audio','🎙️','My Audio'],
 ['videos','🎥','My Videos'],
 ['docs','📄','My Documents'],
 ['codes','🔐','My Codes'],
 ['trusted','👥','My Trusted People'],
 ['settings','⚙️','My Settings'],
 ['profile','👤','My Profile']
];

let current='home';

/* =========================================================
   LOCAL STORAGE HELPERS
   ========================================================= */

function loadData(key, fallback){
  try{
    const data = localStorage.getItem(key);
    return data ? JSON.parse(data) : fallback;
  }catch(error){
    console.error("Could not load",key,error);
    return fallback;
  }
}

function saveData(key,data){
  try{
    localStorage.setItem(key,JSON.stringify(data));
    return true;
  }catch(error){
    console.error("Could not save",key,error);
    toast("The browser could not save this information.");
    return false;
  }
}

let diaryEntries = loadData('willastateDiary',[]);
let trusted = loadData('willastateTrusted',[]);
let willData = loadData('willastateWill',null);
let infoData = loadData('willastateInformation',null);
let messages = loadData('willastateMessages',[]);
let boardPosts = loadData('willastateMessageBoard',[]);
let codesData = loadData('willastateCodes',[]);

let pattern=[];

/* =========================================================
   NAVIGATION
   ========================================================= */

function navHTML(){
  return pages.map(([id,ic,name])=>`
    <button class="${current===id?'active':''}"
      onclick="showPage('${id}')">
      ${ic} ${name}
    </button>
  `).join('');
}

function renderNav(){

  document.getElementById('nav').innerHTML=navHTML();

  const mobilePages=[
    ['home','⌂','Home'],
    ['diary','📔','Diary'],
    ['board','💬','Board'],
    ['trusted','👥','People']
  ];

  document.getElementById('mobileNav').innerHTML=
    mobilePages.map(([id,ic,name])=>`
      <button class="${current===id?'active':''}"
        onclick="showPage('${id}')">
        ${ic}<span>${name}</span>
      </button>
    `).join('');
}

function showPage(id){
  current=id;
  renderNav();

  const c=document.getElementById('content');

  c.innerHTML=page(id);

  window.scrollTo(0,0);
}

function page(id){

  switch(id){

    case 'home':
      return home();

    case 'will':
      return willPage();

    case 'diary':
      return diary();

    case 'board':
      return messageBoard();

    case 'info':
      return informationPage();

    case 'messages':
      return messagesPage();

    case 'audio':
      return media(
        '🎙️',
        'My Audio',
        'Record private voice messages and memories.',
        'Record Audio'
      );

    case 'videos':
      return media(
        '🎥',
        'My Videos',
        'Record private video messages and memories.',
        'Record Video'
      );

    case 'docs':
      return docs();

    case 'codes':
      return codes();

    case 'trusted':
      return trustedPage();

    case 'settings':
      return settings();

    case 'profile':
      return profile();

    case 'release':
      return release();

    default:
      return home();
  }
}

/* =========================================================
   HOME
   ========================================================= */

function home(){

return `
<section class="hero">

  <div class="eyebrow">Welcome to Willastate</div>

  <h1>
    Your life. Your way.<br>
    Your wishes.
    <span style="color:var(--purple)">Your legacy.</span>
  </h1>

  <p>
    One private place for the information, memories, wishes and
    messages that matter most — for the people you trust,
    when they need it most.
  </p>

  <button class="btn primary" onclick="showPage('board')">
    💬 Open Message Board
  </button>

</section>

<div class="row" style="margin-bottom:12px">

  <div>
    <h2>My Willastate</h2>
    <p style="margin:0">
      Everything you need, all in one place.
    </p>
  </div>

  <span class="badge locked">
    🔒 Private by default
  </span>

</div>

<div class="grid">

 ${tile(
   'will',
   '✍️',
   'My Will',
   'Write and organize your will and wishes'
 )}

 ${tile(
   'diary',
   '📔',
   'My Mobile Diary',
   'Write, record and journal your daily life'
 )}

 ${tile(
   'board',
   '💬',
   'Day-by-Day Message Board',
   'Share daily thoughts and messages'
 )}

 ${tile(
   'info',
   '📝',
   'My Information',
   'Personal, family and important information'
 )}

 ${tile(
   'messages',
   '❤️',
   'My Messages',
   'Important messages for your loved ones'
 )}

 ${tile(
   'audio',
   '🎙️',
   'My Audio',
   'Voice recordings and audio messages'
 )}

 ${tile(
   'videos',
   '🎥',
   'My Videos',
   'Video messages and important moments'
 )}

 ${tile(
   'docs',
   '📄',
   'My Documents',
   'Important documents and files'
 )}

 ${tile(
   'codes',
   '🔐',
   'My Codes',
   'Secure codes, passwords and combinations'
 )}

 ${tile(
   'trusted',
   '👥',
   'My Trusted People',
   'Manage your trusted people — 1 or 2 only'
 )}

 ${tile(
   'settings',
   '⚙️',
   'My Settings',
   'Account security and preferences'
 )}

</div>
`;
}

function tile(id,ic,title,sub){

return `
<button
 class="card tile"
 style="border:1px solid var(--line);text-align:left"
 onclick="showPage('${id}')">

 <div class="ico">${ic}</div>

 <div>
   <h3>${title}</h3>
   <small>${sub}</small>
 </div>

 <strong style="margin-left:auto;color:var(--purple)">
   ›
 </strong>

</button>
`;
}

function simple(ic,title,sub,body){

return `
<section class="hero" style="padding:24px">

 <div class="eyebrow">
   ${ic} Willastate
 </div>

 <h1 style="font-size:32px">
   ${title}
 </h1>

 <p>${sub}</p>

</section>

${body}
`;
}

/* =========================================================
   MY WILL
   ========================================================= */

function willPage(){

  if(willData){

    return `
    <section class="hero" style="padding:24px">

      <div class="eyebrow">✍️ Willastate</div>

      <h1 style="font-size:32px">
        My Will
      </h1>

      <p>
        Your saved wishes and estate information.
      </p>

    </section>

    <div class="card stack">

      <div class="notice">
        🔒 Your Will information is stored privately
        in this browser prototype.
      </div>

      <div>
        <strong>Full legal name</strong>
        <p>${escapeHTML(willData.name)}</p>
      </div>

      <div>
        <strong>State</strong>
        <p>${escapeHTML(willData.state || 'Not entered')}</p>
      </div>

      <div>
        <strong>My wishes</strong>
        <p>${escapeHTML(willData.wishes || 'No wishes entered')}</p>
      </div>

      <div>
        <strong>Funeral or final wishes</strong>
        <p>${escapeHTML(willData.funeral || 'No final wishes entered')}</p>
      </div>

      <div class="notice">
        Last saved: ${escapeHTML(willData.savedAt)}
      </div>

      <div class="small-actions">

        <button
          class="btn primary"
          onclick="editWill()">
          ✏️ Edit My Will
        </button>

        <button
          class="btn danger"
          onclick="deleteWill()">
          🗑️ Delete My Will
        </button>

      </div>

    </div>
    `;
  }

  return `

  <section class="hero" style="padding:24px">

    <div class="eyebrow">✍️ Willastate</div>

    <h1 style="font-size:32px">
      My Will
    </h1>

    <p>
      Organize your wishes and estate information
      in one private place.
    </p>

  </section>

  <div class="card stack">

    <div class="notice">
      This prototype helps you organize your wishes.
      Legal requirements for a valid will vary by state.
      Willastate does not currently certify this as a
      legally executed will.
    </div>

    <div class="form-grid">

      <div>
        <label>Full legal name</label>
        <input
          id="willName"
          placeholder="Your name">
      </div>

      <div>
        <label>State</label>
        <input
          id="willState"
          placeholder="Georgia">
      </div>

    </div>

    <div>
      <label>My wishes</label>
      <textarea
        id="willWishes"
        placeholder="Write your wishes and instructions..."></textarea>
    </div>

    <div>
      <label>Funeral or final wishes</label>
      <textarea
        id="willFuneral"
        placeholder="Optional..."></textarea>
    </div>

    <div class="row">

      <span class="badge locked">
        🔒 Private
      </span>

      <button
        class="btn primary"
        onclick="saveWill()">
        💾 Save My Will
      </button>

    </div>

  </div>

  `;
}


function editWill(){

  if(!willData){
    return showPage('will');
  }

  document.getElementById('content').innerHTML = `

  <section class="hero" style="padding:24px">

    <div class="eyebrow">✏️ Editing</div>

    <h1 style="font-size:32px">
      Edit My Will
    </h1>

    <p>
      Make your changes below, then save them.
    </p>

  </section>

  <div class="card stack">

    <div class="form-grid">

      <div>
        <label>Full legal name</label>
        <input
          id="willName"
          value="${escapeAttr(willData.name || '')}">
      </div>

      <div>
        <label>State</label>
        <input
          id="willState"
          value="${escapeAttr(willData.state || '')}">
      </div>

    </div>

    <div>
      <label>My wishes</label>
      <textarea
        id="willWishes">${escapeHTML(willData.wishes || '')}</textarea>
    </div>

    <div>
      <label>Funeral or final wishes</label>
      <textarea
        id="willFuneral">${escapeHTML(willData.funeral || '')}</textarea>
    </div>

    <div class="small-actions">

      <button
        class="btn secondary"
        onclick="showPage('will')">
        Cancel
      </button>

      <button
        class="btn primary"
        onclick="saveWill()">
        💾 Save Changes
      </button>

      <button
        class="btn danger"
        onclick="deleteWill()">
        🗑️ Delete
      </button>

    </div>

  </div>

  `;
}
/* =========================================================
   MOBILE DIARY
   ========================================================= */

function diary(){

return `

<section class="hero" style="padding:24px">

 <div class="row">

   <div>

     <div class="eyebrow">
       📔 My Mobile Diary
     </div>

     <h1 style="font-size:32px">
       Your private daily space.
     </h1>

     <p>
       Write, add a photo, record audio or video,
       and keep the moments you want to remember.
     </p>

   </div>

   <button class="btn secondary"
     onclick="toast('Calendar will be connected in a future build.')">
     📅 Calendar
   </button>

 </div>

</section>

function selectDot(i){

if(pattern.includes(i))return;

pattern.push(i);

const dots=document.querySelectorAll('.dot');

if(dots[i]){
  dots[i].classList.add('selected');
}

if(pattern.length>=4){

document.getElementById('patternMsg').textContent=
'Pattern entered — prototype unlock accepted.';

}

}

function resetPattern(){

pattern=[];

document.querySelectorAll('.dot')
.forEach(d=>d.classList.remove('selected'));

const m=document.getElementById('patternMsg');

if(m)m.textContent='';

}

/* =========================================================
   INVITE TRUSTED PERSON
   ========================================================= */

function inviteTrusted(){

  const name =
    document.getElementById('tpName').value.trim();

  const email =
    document.getElementById('tpEmail').value.trim();


  if(!name){

    return toast(
      'Please enter their full name.'
    );

  }


  if(!email){

    return toast(
      'Please enter their email address.'
    );

  }


  if(!email.includes('@') || !email.includes('.')){

    return toast(
      'Please enter a valid email address.'
    );

  }


  if(trusted.length >= 2){

    return toast(
      'You can have only 2 Trusted People.'
    );

  }


  const alreadyExists =
    trusted.some(
      t =>
        t.email.toLowerCase() ===
        email.toLowerCase()
    );


  if(alreadyExists){

    return toast(
      'That person is already on your Trusted People list.'
    );

  }


  trusted.push({

    id: Date.now(),

    name: name,

    email: email,

    status: 'Invitation Sent',

    invitedAt: new Date().toLocaleString()

  });


  if(saveData('willastateTrusted',trusted)){

    toast(
      'Trusted Person invitation created.'
    );

    showPage('trusted');

  }

}


/* =========================================================
   EDIT TRUSTED PERSON
   ========================================================= */

function editTrusted(index){

  const t = trusted[index];


  const name = prompt(
    'Edit Trusted Person name:',
    t.name
  );


  if(name === null){
    return;
  }


  const email = prompt(
    'Edit email address:',
    t.email
  );


  if(email === null){
    return;
  }


  if(!name.trim()){

    return toast(
      'Name cannot be empty.'
    );

  }


  if(!email.trim()){

    return toast(
      'Email cannot be empty.'
    );

  }


  t.name = name.trim();

  t.email = email.trim();


  if(saveData('willastateTrusted',trusted)){

    toast(
      'Trusted Person updated.'
    );

    showPage('trusted');

  }

}


/* =========================================================
   RESEND TRUSTED PERSON INVITATION
   ========================================================= */

function resendTrusted(index){

  const t = trusted[index];


  t.status = 'Invitation Sent';

  t.invitedAt =
    new Date().toLocaleString();


  if(saveData('willastateTrusted',trusted)){

    toast(
      'Invitation resent to ' + t.email
    );

    showPage('trusted');

  }

}


/* =========================================================
   REMOVE TRUSTED PERSON
   ========================================================= */

function removeTrusted(index){

  confirmDelete(

    'Remove Trusted Person?',

    'This person will be removed from your Trusted People list.',

    ()=>{

      trusted.splice(index,1);

      if(saveData('willastateTrusted',trusted)){

        toast(
          'Trusted Person removed.'
        );

        showPage('trusted');

      }

    }

  );

}

/* =========================================================

   ========================================================= */

function toast(msg){

const t=document.createElement('div');

t.textContent=msg;

t.style=`
position:fixed;
left:50%;
bottom:30px;
transform:translateX(-50%);
background:#171522;
color:white;
padding:13px 17px;
border-radius:12px;
z-index:100;
box-shadow:0 10px 30px rgba(0,0,0,.25);
max-width:90%;
text-align:center;
`;

document.body.appendChild(t);

setTimeout(()=>{
  t.remove();
},2800);

}

/* =========================================================
   SECURITY / HTML HELPERS
   ========================================================= */

function escapeHTML(s){

return String(s||'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c])
);

}

function escapeAttr(s){

return escapeHTML(s);

}
