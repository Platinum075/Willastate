<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b24a8">
<title>Willastate — Your life. Your way. Your wishes. Your legacy.</title>
<style>
:root{
  --purple:#4b24a8;--purple2:#6b42d8;--ink:#171522;--muted:#6d6878;
  --bg:#f7f5fb;--card:#fff;--line:#e8e3f1;--green:#1f9d62;--pink:#e94f9d;
  --shadow:0 10px 30px rgba(42,25,82,.10);--radius:20px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{font-family:Georgia,serif;color:var(--purple);font-size:25px;font-weight:700;display:flex;gap:8px;align-items:center}
.brand span{font-size:18px}
.top-actions{display:flex;gap:10px;align-items:center}
.iconbtn{border:0;background:#f0ebfa;color:var(--purple);width:42px;height:42px;border-radius:12px}
.layout{display:flex;max-width:1280px;margin:auto}
.sidebar{width:260px;padding:24px 16px;min-height:calc(100vh - 72px);border-right:1px solid var(--line);background:#fff}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:13px;color:#3f3a49}
.nav button.active,.nav button:hover{background:#f0ebfa;color:var(--purple);font-weight:700}
.content{flex:1;padding:28px;max-width:1000px}
.hero{background:linear-gradient(135deg,#fff,#f0eafb);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow);margin-bottom:24px}
.eyebrow{color:var(--purple);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:38px;line-height:1.08;margin:10px 0 8px}
h2{font-size:27px;margin:0 0 8px}
h3{margin:0 0 7px}
p{color:var(--muted);line-height:1.55}
.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:800}
.primary{background:var(--purple);color:#fff}
.secondary{background:#fff;color:var(--purple);border:1px solid #cfc5e5}
.danger{background:#fff0f1;color:#b4232c}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 5px 18px rgba(42,25,82,.05)}
.tile{display:flex;gap:14px;align-items:center;min-height:92px;transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#f0ebfa}
.tile small{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
label{font-size:13px;font-weight:800;color:#3e3948;display:block;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid #dcd5e8;background:#fff;border-radius:12px;padding:12px 13px;outline:none}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #eee8fa}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;background:#edf9f2;color:var(--green)}
.badge.pending{background:#fff5dc;color:#9a6a00}
.badge.locked{background:#f1eef5;color:#5d5767}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}
.notice{background:#f6f1ff;border:1px solid #ded3f4;padding:14px;border-radius:14px;color:#4a3b68}
.diary-entry{border-left:4px solid var(--pink);padding:15px 17px;background:#fff;border-radius:0 15px 15px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.dot-grid{display:grid;grid-template-columns:repeat(3,62px);gap:18px;justify-content:center;padding:18px}
.dot{width:62px;height:62px;border-radius:50%;border:2px solid #b9b1c7;background:#fff;position:relative}
.dot.selected{background:#a8dfb8;border-color:#49a96d}
.dot.selected:after{content:"";position:absolute;inset:15px;border-radius:50%;background:#fff}
.pattern-area{background:#131c29;border-radius:22px;padding:22px;color:#fff;text-align:center}
.pattern-area p{color:#c6ccd6}
.mobile-preview{max-width:390px;margin:0 auto;border:10px solid #17151d;border-radius:38px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.mobile-head{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--purple);font-weight:800}
.mobile-body{padding:16px;max-height:650px;overflow:auto}
.public-profile{max-width:560px;margin:auto}
.profile-cover{background:linear-gradient(135deg,#4b24a8,#7c55dc);height:120px;border-radius:22px 22px 0 0}
.avatar{width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:30px;margin:-42px auto 8px;color:var(--purple)}
.modal{position:fixed;inset:0;background:rgba(20,14,30,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:22px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.mobile-nav{display:none}
.muted{color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;padding:8px 0}
.check input{width:auto}
@media(max-width:820px){
  .sidebar{display:none}.content{padding:18px 14px 90px}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
  .topbar{padding:0 14px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:8px 4px}
  .mobile-nav button{border:0;background:transparent;color:#625b70;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .mobile-nav button.active{color:var(--purple);font-weight:800}.hero{padding:24px}h1{font-size:31px}
}
</style>
</head>
<body>
<noscript><div style="padding:20px;background:#fff0f1;color:#7a1f26;text-align:center;font-weight:700">Willastate needs JavaScript enabled to use the interactive prototype.</div></noscript>
<div class="app">
<header class="topbar">
  <div class="brand">Willastate <span>🪶</span></div>
  <div class="top-actions"><button class="iconbtn" onclick="showPage('profile')">👤</button><button class="iconbtn" onclick="showPage('settings')">⚙️</button></div>
</header>

<div class="layout">
<aside class="sidebar">
  <div class="nav" id="nav"></div>
</aside>
<main class="content" id="content"></main>
</div>

<nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div class="modal" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const pages = [
 ['home','⌂','Home'],['will','✍️','My Will'],['diary','📔','Mobile Diary'],['info','📝','My Information'],
 ['messages','❤️','My Messages'],['audio','🎙️','My Audio'],['videos','🎥','My Videos'],['docs','📄','My Documents'],
 ['codes','🔐','My Codes'],['trusted','👥','My Trusted People'],['settings','⚙️','My Settings'],['profile','👤','My Profile']
];
let current='home';
let diaryEntries = JSON.parse(localStorage.getItem('willastateDiary')||'[]');
let trusted = JSON.parse(localStorage.getItem('willastateTrusted')||'[]');

function navHTML(){
  return pages.map(([id,ic,name])=>`<button class="${current===id?'active':''}" onclick="showPage('${id}')">${ic} ${name}</button>`).join('');
}
function renderNav(){
  document.getElementById('nav').innerHTML=navHTML();
  document.getElementById('mobileNav').innerHTML=pages.slice(0,4).map(([id,ic,name])=>`<button class="${current===id?'active':''}" onclick="showPage('${id}')">${ic}<span>${name.replace('My ','')}</span></button>`).join('')+
  `<button onclick="showPage('trusted')">👥<span>People</span></button>`;
}
function showPage(id){
  current=id; renderNav(); const c=document.getElementById('content'); c.innerHTML = page(id); window.scrollTo(0,0);
}
function page(id){
 switch(id){
 case 'home': return home();
 case 'will': return simple('✍️','My Will','Organize your wishes and estate information in one private place.',willForm());
 case 'diary': return diary();
 case 'info': return simple('📝','My Information','Personal information you want organized and protected.',infoForm());
 case 'messages': return simple('❤️','My Messages','Write messages for the people you love and choose if and when they may be released.',messageForm());
 case 'audio': return media('🎙️','My Audio','Record private voice messages and memories.','Record Audio');
 case 'videos': return media('🎥','My Videos','Record private video messages and memories.','Record Video');
 case 'docs': return docs();
 case 'codes': return codes();
 case 'trusted': return trustedPage();
 case 'settings': return settings();
 case 'profile': return profile();
 case 'release': return release();
 default: return home();
 }
}
function home(){return `
<section class="hero">
 <div class="eyebrow">Welcome to Willastate</div>
 <h1>Your life. Your way.<br>Your wishes. <span style="color:var(--purple)">Your legacy.</span></h1>
 <p>One private place for the information, memories, wishes and messages that matter most — for the people you trust, when they need it most.</p>
 <button class="btn primary" onclick="showPage('diary')">Open My Mobile Diary</button>
</section>
<div class="row" style="margin-bottom:12px"><div><h2>My Willastate</h2><p style="margin:0">Everything you need, all in one place.</p></div><span class="badge locked">🔒 Private by default</span></div>
<div class="grid">
 ${tile('will','✍️','My Will','Write and organize your will and wishes')}
 ${tile('diary','📔','My Mobile Diary','Write, record and journal your daily life')}
 ${tile('info','📝','My Information','Personal, family and important information')}
 ${tile('messages','❤️','My Messages','Important messages for your loved ones')}
 ${tile('audio','🎙️','My Audio','Voice recordings and audio messages')}
 ${tile('videos','🎥','My Videos','Video messages and important moments')}
 ${tile('docs','📄','My Documents','Important documents and files')}
 ${tile('codes','🔐','My Codes','Secure codes, passwords and combinations')}
 ${tile('trusted','👥','My Trusted People','Manage your trusted people — 1 or 2 only')}
 ${tile('settings','⚙️','My Settings','Account security and preferences')}
</div>`}
function tile(id,ic,title,sub){return `<button class="card tile" style="border:1px solid var(--line);text-align:left" onclick="showPage('${id}')"><div class="ico">${ic}</div><div><h3>${title}</h3><small>${sub}</small></div><strong style="margin-left:auto;color:var(--purple)">›</strong></button>`}
function simple(ic,title,sub,body){return `<section class="hero" style="padding:24px"><div class="eyebrow">${ic} Willastate</div><h1 style="font-size:32px">${title}</h1><p>${sub}</p></section>${body}`}
function willForm(){return `<div class="card stack"><div class="notice">This prototype helps you organize your wishes. Legal requirements for a valid will vary by state; Willastate does not currently certify this as a legally executed will.</div><div class="form-grid"><div><label>Full legal name</label><input placeholder="Your name"></div><div><label>State</label><input placeholder="Georgia"></div></div><div><label>My wishes</label><textarea placeholder="Write your wishes and instructions..."></textarea></div><div><label>Funeral or final wishes</label><textarea placeholder="Optional..."></textarea></div><div class="row"><span class="badge locked">🔒 Private</span><button class="btn primary" onclick="toast('Will information saved in prototype.')">Save My Will</button></div></div>`}
function diary(){return `<section class="hero" style="padding:24px"><div class="row"><div><div class="eyebrow">📔 My Mobile Diary</div><h1 style="font-size:32px">Your private daily space.</h1><p>Write, add a photo, record audio or video, and keep the moments you want to remember.</p></div><button class="btn secondary" onclick="toast('Calendar coming in the next build.')">📅 Calendar</button></div></section>
<div class="card stack"><div><label>New diary entry</label><textarea id="diaryText" placeholder="How was your day? What do you want to remember?"></textarea></div><div class="row"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="toast('Photo attachment will be connected in the backend build.')">🖼️ Add Photo</button><button class="btn secondary" onclick="toast('Audio recording will be connected in the backend build.')">🎙️ Add Voice</button><button class="btn secondary" onclick="toast('Video recording will be connected in the backend build.')">🎥 Add Video</button></div><button class="btn primary" onclick="saveDiary()">Save Entry</button></div></div>
<div style="height:16px"></div><div class="stack">${diaryEntries.length?diaryEntries.map(e=>`<article class="diary-entry"><div class="row"><strong>${e.date}</strong><span class="badge locked">🔒 Private</span></div><p>${escapeHTML(e.text)}</p></article>`).join(''):`<div class="card"><h3>No diary entries yet.</h3><p>Your first entry will appear here.</p></div>`}</div>`}
function saveDiary(){const t=document.getElementById('diaryText').value.trim();if(!t)return toast('Write something first.');diaryEntries.unshift({date:new Date().toLocaleString(),text:t});localStorage.setItem('willastateDiary',JSON.stringify(diaryEntries));showPage('diary');}
function infoForm(){return `<div class="card stack"><div class="form-grid"><div><label>Full name</label><input placeholder="Your name"></div><div><label>Preferred phone</label><input placeholder="(000) 000-0000"></div><div><label>Important family contact</label><input placeholder="Name"></div><div><label>Other notes</label><input placeholder="Optional"></div></div><div><label>Important information</label><textarea placeholder="Information you want organized privately..."></textarea></div><button class="btn primary" onclick="toast('Information saved in prototype.')">Save Information</button></div>`}
function messageForm(){return `<div class="card stack"><div><label>Message title</label><input placeholder="For my family"></div><div><label>Message</label><textarea placeholder="Write your message..."></textarea></div><div class="form-grid"><div><label>Who can receive it?</label><select><option>Choose recipients</option><option>My Trusted Person #1</option><option>My Trusted Person #2</option><option>Multiple recipients</option></select></div><div><label>When?</label><select><option>Verified death</option><option>Approved emergency circumstance</option><option>Manual release by me</option></select></div></div><button class="btn primary" onclick="toast('Message saved in prototype.')">Save Message</button></div>`}
function media(ic,title,sub,action){return `<section class="hero" style="padding:24px"><div class="eyebrow">${ic} Willastate</div><h1 style="font-size:32px">${title}</h1><p>${sub}</p></section><div class="card" style="text-align:center;padding:40px"><div style="font-size:64px">${ic}</div><h2>Keep your memories private.</h2><p>Camera and microphone permissions will be connected in the working mobile build.</p><button class="btn primary" onclick="toast('${action} will be connected in the backend/mobile build.')">${action}</button></div>`}
function docs(){return simple('📄','My Documents','Keep important documents organized and private.',`<div class="card stack"><div class="notice">Files will be stored in private storage in the production build. Public links will not be used for private documents.</div><button class="btn primary" onclick="toast('Secure file upload will be connected next.')">＋ Add Document</button><div class="list"><div class="list-item row"><div><strong>Example document</strong><div class="muted">Prototype only</div></div><span class="badge locked">🔒 Private</span></div></div></div>`)}
function codes(){return simple('🔐','My Codes','A high-security area for codes and other secrets you choose to store.',`<div class="pattern-area"><div style="font-size:30px">🔒</div><h2 style="color:#fff">Unlock My Codes</h2><p>Enter your 9-dot pattern.</p><div class="dot-grid" id="dots">${Array.from({length:9},(_,i)=>`<button class="dot" onclick="selectDot(${i})" aria-label="Pattern dot ${i+1}"></button>`).join('')}</div><div id="patternMsg" style="color:#9de0b5;min-height:24px"></div><button class="btn secondary" onclick="resetPattern()">Reset Pattern</button><div style="margin-top:18px;border:1px solid #425064;border-radius:14px;padding:12px;text-align:left"><strong>Security reminder</strong><p style="margin:4px 0;color:#c6ccd6">Never share your pattern. The production version will use stronger authentication and protected storage.</p></div></div><div style="height:16px"></div><div class="card"><h3>Example vault items</h3><div class="list"><div class="list-item row"><span>Phone access code</span><span class="badge locked">🔒 Locked</span></div><div class="list-item row"><span>Safe combination</span><span class="badge locked">🔒 Locked</span></div><div class="list-item row"><span>Other private code</span><span class="badge locked">🔒 Locked</span></div></div></div>`)}
let pattern=[];
function selectDot(i){if(pattern.includes(i))return;pattern.push(i);document.querySelectorAll('.dot')[i].classList.add('selected');if(pattern.length>=4)document.getElementById('patternMsg').textContent='Pattern entered — prototype unlock accepted.'}
function resetPattern(){pattern=[];document.querySelectorAll('.dot').forEach(d=>d.classList.remove('selected'));const m=document.getElementById('patternMsg');if(m)m.textContent='';}
function trustedPage(){return `<section class="hero" style="padding:24px"><div class="eyebrow">👥 My Trusted People</div><h1 style="font-size:32px">Choose 1 or 2 people you trust.</h1><p>They must knowingly accept the responsibility. They do not get access to your private information simply by becoming a Trusted Person.</p></section>
<div class="grid"><div class="card stack"><h3>Invite a Trusted Person</h3><div><label>Full name</label><input id="tpName" placeholder="Sarah Johnson"></div><div><label>Email address</label><input id="tpEmail" type="email" placeholder="sarah@example.com"></div><button class="btn primary" onclick="inviteTrusted()">Send Invitation</button><small class="muted">If they are not a Willastate member, the email will invite them to create a free account and accept or decline.</small></div>
<div class="card"><h3>Your Trusted People</h3><div class="list" id="trustedList">${trusted.length?trusted.map((t,i)=>`<div class="list-item"><div class="row"><strong>${escapeHTML(t.name)}</strong><span class="badge ${t.status==='Confirmed'?'':'pending'}">${t.status==='Confirmed'?'🟢':'🟡'} ${t.status}</span></div><div class="muted">${escapeHTML(t.email)}</div><div style="margin-top:10px"><button class="btn danger" onclick="removeTrusted(${i})">Remove</button></div></div>`).join(''):`<p>You haven't selected anyone yet.</p>`}</div></div></div>
<div style="height:16px"></div><div class="card"><h3>How the invitation works</h3><div class="list"><div class="list-item">1. You send the invitation by email.</div><div class="list-item">2. They create or sign into Willastate.</div><div class="list-item">3. They review the responsibility and Accept or Decline.</div><div class="list-item">4. Only after accepting are they a confirmed Trusted Person.</div></div></div>
<div style="height:16px"></div><div class="card"><h3>Release settings</h3><p>Trusted People are limited to 1–2, but individual information can be released to multiple recipients.</p><button class="btn secondary" onclick="showPage('release')">Open Release Settings</button></div>`}
function inviteTrusted(){const n=document.getElementById('tpName').value.trim(),e=document.getElementById('tpEmail').value.trim();if(!n||!e)return toast('Enter a name and email.');if(trusted.length>=2)return toast('You can have only 2 Trusted People.');trusted.push({name:n,email:e,status:'Invitation Sent'});localStorage.setItem('willastateTrusted',JSON.stringify(trusted));showPage('trusted');toast('Invitation created. In the production build this will send a secure email invitation.')}
function removeTrusted(i){trusted.splice(i,1);localStorage.setItem('willastateTrusted',JSON.stringify(trusted));showPage('trusted')}
function release(){return `<section class="hero" style="padding:24px"><div class="eyebrow">Release Settings</div><h1 style="font-size:32px">You decide who gets what and when.</h1><p>Set different recipients and release circumstances for individual items.</p></section><div class="card stack"><div><label>What is this?</label><input value="Financial Instructions"></div><div><label>Who can receive this?</label>${['Sarah Johnson','Michael Owens','Jessica Owens','Robert Williams'].map((x,i)=>`<label class="check"><input type="checkbox" ${i<3?'checked':''}> ${x}</label>`).join('')}</div><div><label>When should it be released?</label>${['Verified death','Approved emergency circumstance','Manual release by me'].map(x=>`<label class="check"><input type="checkbox" checked> ${x}</label>`).join('')}</div><div><label>What should they receive?</label><select><option>All authorized information</option><option>Only this item</option><option>Custom selection</option></select></div><button class="btn primary" onclick="toast('Release settings saved in prototype.')">Save Release Setting</button></div>`}
function settings(){return simple('⚙️','My Settings','Control your account, security and privacy.',`<div class="grid"><div class="card"><h3>🔐 Account Security</h3><p>Two-factor authentication will be available in the production account system.</p><button class="btn secondary" onclick="toast('Security settings are part of Phase 2.')">Manage Security</button></div><div class="card"><h3>🔒 Privacy</h3><p>Your private vault is designed to be private by default. Public profiles reveal only information you choose.</p><button class="btn secondary" onclick="toast('Privacy controls are coming next.')">Privacy Controls</button></div><div class="card"><h3>📋 Activity</h3><p>Review important account and release activity.</p><button class="btn secondary" onclick="toast('Activity log is planned for the secure backend build.')">View Activity</button></div><div class="card"><h3>🚪 Account</h3><button class="btn danger" onclick="toast('Logout will be connected when real authentication is added.')">Log Out</button></div></div>`)}
function profile(){return `<section class="public-profile"><div class="card" style="padding:0;overflow:hidden"><div class="profile-cover"></div><div style="padding:0 22px 24px;text-align:center"><div class="avatar">👤</div><h2>Damion Owens</h2><p style="margin-top:0">Willastate Member</p><div class="notice" style="text-align:left"><strong>👥 Trusted Contact Available</strong><br><span class="muted">A trusted person has been designated for this account. Their private contact information is not displayed publicly.</span></div><button class="btn primary" style="margin-top:14px" onclick="openModal('Contact Trusted Person','Send a secure message to the designated Trusted Person. Their email address will remain private.')">Contact Trusted Person</button></div></div></section>`}
function openModal(title,text){document.getElementById('modalBox').innerHTML=`<div class="row"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><p>${text}</p><label>Your name</label><input placeholder="Your name"><label style="margin-top:12px">Message</label><textarea placeholder="I need to contact the Willastate Trusted Person because..."></textarea><button class="btn primary" style="margin-top:14px" onclick="closeModal();toast('Secure contact request created in prototype.')">Send Secure Request</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#171522;color:white;padding:13px 17px;border-radius:12px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90%;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
window.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderNav();showPage('home');
</script>
</body>
</html>
